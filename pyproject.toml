[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "deadline-job-attachments"
description = "Library that enables file transfers between workstations and AWS Deadline Cloud using Amazon S3 buckets as content-addressed storage."
authors = [{ name = "Amazon Web Services" }]
dynamic = ["version"]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8, <3.15"
# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]

# Note: All deps should be using >= since this is a *library* as well as an application.
# Applications that consume this library should be the ones that are more strictly
# limiting dependencies if they want/need to.
dependencies = [
  "boto3 >= 1.42.29; python_version >= '3.9'",
  "boto3 >= 1.36.8; python_version < '3.9'",
  "typing_extensions >= 4.8",
  "xxhash >= 3.4,< 4.1",
  "pywin32 >= 307; sys_platform == 'win32'",
  "psutil >= 7.0.0"
]

[project.urls]
Homepage = "https://github.com/aws-deadline/deadline-cloud-job-attachments"
Source = "https://github.com/aws-deadline/deadline-cloud-job-attachments"
Changelog = "https://github.com/aws-deadline/deadline-cloud-job-attachments/blob/mainline/CHANGELOG.md"

[tool.hatch.build]
artifacts = ["*_version.py"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_custom_hook.py"

[tool.hatch.build.hooks.custom.copy_version_py]
destinations = ["src/deadline/job_attachments"]

[tool.hatch.build.targets.sdist]
include = ["src/*", "hatch_custom_hook.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/deadline"]
artifacts = ["*_version.py"]

[tool.mypy]
# Enables the type-checker on the interior of functions without type annotations.
check_untyped_defs = true
# Displaying specific error codes makes it easier to silence specific errors
show_error_codes = true
# Show source code snippets and location markers in error messages
pretty = true
# Prohibit equality checks, identity checks, and container checks between non-overlapping types.
strict_equality = true
ignore_missing_imports = true
# Tell mypy that there's a namespace package at src/deadline
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*", "xxhash"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["deadline"]

[tool.ruff.lint.per-file-ignores]
# We need to use a platform assertion to short-circuit mypy type checking on non-Windows platforms
# https://mypy.readthedocs.io/en/stable/common_issues.html#python-version-and-system-platform-checks
# This causes imports to come after regular Python statements causing flake8 rule E402 to be flagged
"src/deadline/job_attachments/_windows/*.py" = ["E402"]


[tool.pytest.ini_options]
xfail_strict = true

addopts = [
  "--durations=5",
  "--cov=src/deadline",
  "--cov-report=html:build/coverage",
  "--cov-report=xml:build/coverage/coverage.xml",
  "--cov-report=term-missing",
  "--numprocesses=auto",
]
testpaths = ["test/unit"]
looponfailroots = ["src", "test/unit"]
markers = [
  "no_setup: mark that test shouldn't use default setups",
  "integ: tests that run against AWS resources",
  "docker: marks tests to be run only in a Docker environment",
  "cross_account: tests that run against other aws accounts",
]
# looponfailroots is deprecated, this removes the deprecation from the test output
filterwarnings = ["ignore::DeprecationWarning"]


[tool.coverage.run]
disable_warnings = ["module-not-measured"]
branch = true
parallel = false
source_pkgs = ["deadline"]
plugins = ["coverage_conditional_plugin"]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.report]
show_missing = true
fail_under = 79

# https://github.com/wemake-services/coverage-conditional-plugin
[tool.coverage.coverage_conditional_plugin.omit]
"sys_platform != 'win32'" = ["src/deadline/job_attachments/_windows/*.py"]

[tool.coverage.coverage_conditional_plugin.rules]
# This cannot be empty otherwise coverage-conditional-plugin crashes with:
# AttributeError: 'NoneType' object has no attribute 'items'
#
# =========== WARNING TO REVIEWERS ============
#
# Any rules added here are ran through Python's
# eval() function so watch for code injection
# attacks.
#
# =========== WARNING TO REVIEWERS ============

[tool.semantic_release]
# Can be removed or set to true once we are v1
major_on_zero = false
tag_format = "{version}"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
allowed_tags = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "style",
  "refactor",
  "test",
  "revert",
]
minor_tags = []
patch_tags = ["chore", "feat", "fix", "refactor", "perf"]

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.semantic_release.changelog]
template_dir = ".semantic_release"

[tool.semantic_release.changelog.environment]
trim_blocks = true
lstrip_blocks = true

[tool.semantic_release.branches.release]
match = "(mainline|release|patch_.*)"
